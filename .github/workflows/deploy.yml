# Каждый день собирает свежие цены и публикует на GitHub Pages оба приложения:
# Пивомер (/) и Detox Monitor (/detox/).
# Также запускается при каждом изменении в main и вручную (Actions → Run workflow).
name: Обновить цены и опубликовать

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # каждый день ~7:17 по Киеву
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Взять историю цен с опубликованного сайта
        run: |
          mkdir -p data
          for f in history.json detox-history.json; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f" -o "data/$f" || rm -f "data/$f"
          done

      - name: Собрать цены на пиво с zakaz.ua (все города)
        run: |
          node scripts/fetch-prices.mjs || {
            echo "::warning::Не удалось собрать цены — оставляю вчерашние"
            BASE="${{ steps.pages.outputs.base_url }}"
            curl -fsSL "$BASE/data/beers.json" -o data/beers.json
            if curl -fsSL "$BASE/data/cities.json" -o data/cities.json; then
              mkdir -p data/city
              for c in $(node -e 'for (const c of require("./data/cities.json").cities) console.log(c.id)'); do
                curl -fsSL "$BASE/data/city/$c.json" -o "data/city/$c.json" || true
              done
            fi
          }

      - name: Собрать цены на Aqua Миргород Detox
        run: |
          node scripts/fetch-detox.mjs || {
            echo "::warning::Не удалось собрать цены Detox — оставляю вчерашние"
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/detox.json" -o data/detox.json || true
          }

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js icons vendor data detox _site/
          rm -f _site/detox/config.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
